name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Test SQLite snapshot utility
        run: python -m unittest scripts.test_backup_sqlite -v
      - name: Import application modules
        run: python -c "from bot.handlers import router; from bot.keyboards import CATALOGS; print('Loaded handlers and', len(CATALOGS), 'catalogs')"
