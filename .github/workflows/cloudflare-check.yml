name: Cloudflare Worker validation

on:
  push:
    branches: [cloudflare-worker-port]
  pull_request:
    branches: [cloudflare-worker-port]

permissions:
  contents: read

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/worker.js
      - name: Verify migration files
        run: |
          test -s cloudflare/schema.sql
          test -s wrangler.toml
          test -s package.json
